[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "jp-statistics-mcp"
version = "0.1.0"
description = "統計ダッシュボードの指標と、日本銀行の時系列統計を調べるMCPサーバーです。"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "httpx>=0.28.1,<1",
  "mcp>=2.2.0,<3",
  "pydantic>=2.13.5,<3",
]

[project.scripts]
jp-statistics-mcp = "jp_statistics_mcp.__main__:main"
e-stat-dashboard-mcp = "e_stat_dashboard_mcp.__main__:main"
boj-stats-mcp = "boj_stats_mcp.__main__:main"

[dependency-groups]
dev = [
  "pytest>=8.4.1",
  "pytest-asyncio>=1.1.0",
  "respx>=0.22.0",
  "ruff>=0.16.9",
  "ty>=0.0.84",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.hatch.build.targets.wheel]
packages = ["src/jp_statistics_mcp", "src/e_stat_dashboard_mcp", "src/boj_stats_mcp"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"

addopts = "--import-mode=importlib"
